name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install sandbox runtime
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Verify tag matches VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\n' < VERSION)"

      - name: Run deterministic release gate
        run: python3 scripts/release_check.py

      - name: Build deterministic release archive
        run: python3 scripts/package_release.py --output-dir dist

      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
